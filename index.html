<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sodam Bunsik Order</title>
<style>
  :root{
    --bg:#f0f4f9; --card:#ffffff; --text:#1f1f1f; --muted:#5f6368;
    --line:#e1e3e6; --radius:20px;
    --grad: linear-gradient(120deg,#4285F4 0%,#9168C0 50%,#D96570 100%);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Google Sans','Roboto',-apple-system,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px;
  }
  .wrap{max-width:820px; margin:0 auto;}
  .header{
    padding:24px 26px; border-radius:var(--radius); background:var(--grad);
    color:#fff; margin-bottom:14px;
  }
  .header h1{font-size:23px; margin:0 0 4px;}
  .header p{font-size:14px; margin:0; opacity:.9;}

  .tabs{ display:flex; gap:6px; background:#fff; padding:5px; border-radius:16px;
    border:1px solid var(--line); margin-bottom:16px; }
  .tab-btn{ flex:1; border:none; background:transparent; padding:12px 8px; border-radius:12px;
    font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; }
  .tab-btn.active{ background:var(--grad); color:#fff; }

  .card{
    background:var(--card); border-radius:var(--radius); padding:20px;
    margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.06);
    border:1px solid var(--line);
  }
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500;}
  select, input[type=text], input[type=date]{
    width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line);
    font-size:15px; background:#f8f9fa; margin-bottom:16px; font-family:inherit;
  }
  select:focus, input:focus{outline:2px solid #4285F4; background:#fff;}

  .menu-cat{ margin-bottom:10px; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#fff;}
  .menu-cat summary{ padding:12px 14px; font-weight:600; font-size:14px; cursor:pointer; background:#f8f9fa; list-style:none;}
  .menu-cat summary::-webkit-details-marker{ display:none; }
  .menu-cat[open] summary{ border-bottom:1px solid var(--line); }
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px;}
  @media (max-width:420px){ .menu-grid{grid-template-columns:1fr;} }
  .menu-item{
    border:1.5px solid var(--line); border-radius:16px; padding:12px 14px; cursor:pointer;
    transition:all .15s; background:#fff;
  }
  .menu-item.selected{ border-color:#4285F4; background:#e8f0fe; }
  .menu-item.soldout{ opacity:.5; cursor:not-allowed; background:#f8f9fa; }
  .menu-item .name{font-size:15px; font-weight:500;}
  .menu-item .price{font-size:14px; color:var(--muted); margin-top:2px;}
  .soldout-badge{ display:inline-block; background:#fce8e6; color:#a50e0e; border:1px solid #f5c2c0;
    border-radius:8px; padding:1px 6px; font-size:10px; font-weight:700; margin-left:4px; vertical-align:middle;}
  .qty-stepper{ display:none; align-items:center; gap:10px; margin-top:10px; }
  .menu-item.selected .qty-stepper{ display:flex; }
  .qty-stepper button{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:#fff;
    font-size:15px; font-weight:700; color:#4285F4; cursor:pointer; line-height:1;
  }
  .qty-stepper button:hover{ background:#e8f0fe; }
  .qty-stepper span{ font-size:14px; font-weight:700; min-width:16px; text-align:center; }

  .btn{
    width:100%; padding:14px; border:none; border-radius:16px; background:var(--grad);
    color:#fff; font-size:15px; font-weight:600; cursor:pointer; margin-top:6px;
  }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.ghost{ background:#fff; color:var(--text); border:1px solid var(--line); }

  .status{
    border-radius:16px; padding:14px 18px; font-size:14px; margin-bottom:16px;
    background:#fff; border:1px solid var(--line); color:var(--muted); line-height:1.6;
  }
  .status.closed{ background:#fce8e6; color:#a50e0e; border-color:#f5c2c0; }
  .status.open{ background:#e6f4ea; color:#137333; border-color:#c6e6cf; }
  .status.warn{ background:#fef7e0; color:#b06000; border-color:#fde293; }
  .closed-banner{
    background:#fce8e6; color:#a50e0e; border:1px solid #f5c2c0; border-radius:var(--radius);
    padding:16px 20px; margin-bottom:14px; text-align:center; font-size:16px; font-weight:700;
  }
  .closed-banner .sub{ display:block; font-size:13px; font-weight:500; margin-top:4px; opacity:.9; }
  .overlimit-banner{
    background:#fef7e0; color:#8a5700; border:1px solid #fde293; border-radius:var(--radius);
    padding:16px 20px; margin-bottom:14px; text-align:center; font-size:16px; font-weight:700;
  }
  .overlimit-banner .sub{ display:block; font-size:13px; font-weight:500; margin-top:4px; opacity:.9; }
  .warn-badge{ display:inline-block; background:#fef7e0; color:#b06000; border:1px solid #fde293;
    border-radius:10px; padding:3px 9px; font-size:11px; font-weight:600; margin-left:6px; }
  .msg{ font-size:13px; margin-top:10px; text-align:center; min-height:18px; }
  .msg.ok{ color:#137333; } .msg.err{ color:#a50e0e; }

  .group{ background:var(--card); border-radius:var(--radius); padding:20px 22px; margin-bottom:14px;
    border:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .group-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .group-head .title{ font-size:18px; font-weight:700; }
  .group-head .sum{ font-size:14px; color:var(--muted); }
  table{ width:100%; border-collapse:collapse; font-size:15px; }
  th,td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); }
  th{ color:var(--muted); font-weight:600; font-size:13px; }
  .confirm-btn{ padding:8px 16px; border-radius:12px; border:none; cursor:pointer; font-size:13px; font-weight:600;}
  .confirm-btn.on{ background:#e6f4ea; color:#137333; }
  .confirm-btn.off{ background:var(--grad); color:#fff; }
  .empty{ text-align:center; color:var(--muted); padding:30px; }

  .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:8px;}
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .field select, .field input{ margin-bottom:0; }
  .summary{ font-size:14px; color:var(--muted); margin-top:8px; line-height:1.6; }

  .delivery-card{
    background:var(--grad); color:#fff; border-radius:var(--radius);
    padding:20px; margin-bottom:14px; text-align:center;
  }
  .delivery-card .label{ font-size:12px; opacity:.85; margin-bottom:6px; letter-spacing:.02em; }
  .delivery-card .value{ font-size:26px; font-weight:800; line-height:1.3; }
  .delivery-card .sub{ font-size:13px; opacity:.9; margin-top:4px; }
  .delivery-card.empty{ background:#fff; color:var(--muted); border:1px solid var(--line); }
  .delivery-card.empty .value{ font-size:16px; font-weight:600; }

  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  @media print{
    body{ background:#fff; padding:0; }
    .header, .tabs, .no-print{ display:none !important; }
    .card, .group{ box-shadow:none; border:none; padding:0; }
    .tab-panel{ display:block !important; }
    #panel-teacher, #panel-admin, #panel-menu{ display:none !important; }
  }
  @media print{
    .print-only{ display:table-cell !important; }
  }

  /* PC 등 화면이 넓을 때는 전체적으로 조금 더 크게 보이도록 확대 */
  @media (min-width: 900px){
    .wrap{ max-width:960px; }
    body{ font-size:17px; }
    .header h1{ font-size:27px; }
    .header p{ font-size:15px; }
    .tab-btn{ font-size:16px; padding:14px 10px; }
    .card{ padding:26px; }
    label{ font-size:14px; }
    select, input[type=text], input[type=date]{ font-size:16px; padding:14px 16px; }
    .status{ font-size:15px; padding:16px 20px; }
    .menu-cat summary{ font-size:15px; padding:14px 16px; }
    .menu-item .name{ font-size:16px; }
    .menu-item .price{ font-size:15px; }
    .btn{ font-size:16px; padding:16px; }
    .group-head .title{ font-size:20px; }
    .group-head .sum{ font-size:15px; }
    table{ font-size:16px; }
    th{ font-size:14px; }
    th,td{ padding:12px 10px; }
    .delivery-card .value{ font-size:30px; }
    .delivery-card .label{ font-size:13px; }
    .delivery-card .sub{ font-size:15px; }
    .closed-banner{ font-size:18px; padding:20px 24px; }
    .summary{ font-size:15px; }
  }
  @media (min-width: 1200px){
    .wrap{ max-width:1080px; }
    body{ font-size:18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🍙 청북고 소담분식 주문</h1>
    <p>선생님 주문 · 사장님 확인 · 주문 내역을 한 화면에서 확인할 수 있어요.</p>
  </div>

  <div class="tabs no-print">
    <button class="tab-btn active" data-tab="teacher">🍙 주문하기</button>
    <button class="tab-btn" data-tab="admin">👨‍🍳 사장님 확인</button>
    <button class="tab-btn" data-tab="menu">🍽️ 메뉴 관리</button>
    <button class="tab-btn" data-tab="report">📋 주문 내역</button>
  </div>

  <!-- ===================== 선생님 주문 탭 ===================== -->
  <div class="tab-panel active" id="panel-teacher">
    <div id="t-closed-banner"></div>
    <div id="t-overlimit-banner"></div>
    <div class="card">
      <div id="t-delivery-card"></div>
      <div id="t-all-orders"></div>
    </div>

    <div class="card">
      <label>교무실 선택</label>
      <select id="t-office"></select>

      <label>이름</label>
      <input type="text" id="t-name" placeholder="이름을 입력하세요">

      <div id="t-phone-field" style="display:none;">
        <label>📞 대표 연락처 <span style="color:#a50e0e;">(이 교무실 오늘 첫 주문! 사장님이 연락드릴 수 있도록 꼭 입력해주세요)</span></label>
        <input type="text" id="t-phone" placeholder="010-0000-0000" maxlength="13" inputmode="numeric">
      </div>

      <div id="t-status" class="status">오늘 전체 주문 현황을 확인하고 있어요...</div>

      <label>메뉴 선택 (여러 개 선택 가능)</label>
      <div id="t-menu"></div>
      <div id="t-selected" class="status" style="display:none;"></div>

      <button class="btn" id="t-submit" disabled>주문하기</button>
      <div class="msg" id="t-msg"></div>
    </div>
  </div>

  <!-- ===================== 사장님 확인 탭 ===================== -->
  <div class="tab-panel" id="panel-admin">
    <div class="card no-print" style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn ghost" style="margin:0; width:auto; flex:1 1 140px;" onclick="loadAdmin()">🔄 새로고침</button>
      <button class="btn" style="margin:0; width:auto; flex:1 1 140px; background:linear-gradient(120deg,#D96570,#b03a3a);" onclick="closeAllOrders()">🔒 주문 일괄 마감</button>
      <button class="btn" style="margin:0; width:auto; flex:1 1 140px; background:linear-gradient(120deg,#34a853,#137333);" onclick="reopenAllOrders()">🔓 주문 일괄 해제</button>
      <span id="a-refreshing" style="display:none; font-size:12px; color:var(--muted); align-self:center;">⏳ 새로고침 중...</span>
    </div>
    <div id="a-delivery-card"></div>
    <div id="a-content"></div>
  </div>

  <!-- ===================== 메뉴 관리 탭 ===================== -->
  <div class="tab-panel" id="panel-menu">
    <div class="card no-print">
      <button class="btn ghost" style="margin-bottom:16px;" onclick="loadMenuAdmin()">🔄 새로고침</button>
      <span id="m-refreshing" style="display:none; font-size:12px; color:var(--muted); margin-left:8px;">⏳ 새로고침 중...</span>
      <label>➕ 새 메뉴 추가</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input type="text" id="m-new-category" placeholder="분류 (예: 단품)" style="flex:1 1 120px;">
        <input type="text" id="m-new-name" placeholder="메뉴명" style="flex:2 1 160px;">
        <input type="number" id="m-new-price" placeholder="가격" style="flex:1 1 100px;">
      </div>
      <button class="btn" onclick="addMenu()">메뉴 추가</button>
      <div class="msg" id="m-add-msg"></div>
    </div>
    <div id="m-content"></div>
  </div>

  <!-- ===================== 주문 내역 탭 ===================== -->
  <div class="tab-panel" id="panel-report">
    <div class="card">
      <div class="controls">
        <div class="field">
          <label>기간</label>
          <select id="r-range">
            <option value="day">오늘</option>
            <option value="month">이번 달</option>
            <option value="custom">직접 선택</option>
          </select>
        </div>
        <div class="field" id="r-customStart" style="display:none">
          <label>시작일</label><input type="date" id="r-start">
        </div>
        <div class="field" id="r-customEnd" style="display:none">
          <label>종료일</label><input type="date" id="r-end">
        </div>
        <button class="btn ghost" style="width:auto;margin:0;padding:10px 16px;" onclick="loadReport()">조회</button>
        <button class="btn ghost" style="width:auto;margin:0;padding:10px 16px;" onclick="window.print()">🖨 인쇄</button>
      </div>
    </div>
    <div class="card" id="r-result"></div>
  </div>
</div>

<script>
// ⚠️ 배포된 Apps Script 웹 앱 주소(.../exec)를 여기에 넣어주세요.
// Apps Script 편집기 → 배포 → 배포 관리 에서 확인할 수 있습니다.
// 이 파일을 GitHub Pages 등 외부에 올려도, 실제 데이터는 항상 이 주소(구글시트)로 오갑니다.
const API_URL = 'https://script.google.com/macros/s/AKfycbx6WEzzLKsGlZycQcWJi_C4g7ZsO9jlbEqlfc-CBUbdAMAGV29RBndX6b9BFdhSy9_g2Q/exec';

// google.script.run 대신 쓰는 통신 헬퍼.
// method 'GET'(기본): 조회용, URL 파라미터로 전송 — 이름/연락처 등 개인정보가 없는 호출에 사용
// method 'POST': 저장/수정용, 본문(JSON)으로 전송 — 개인정보가 주소창에 남지 않도록 이걸 사용
// 반환값은 Promise이며, 성공 시 서버 함수의 원래 반환값을 그대로 돌려준다.
function callApi(fn, args, method){
  args = args || [];
  let req;
  if(method === 'POST'){
    req = fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 브라우저 사전 확인(preflight) 요청을 피하기 위한 설정
      body: JSON.stringify({ fn, args }),
    });
  } else {
    const url = API_URL + '?fn=' + encodeURIComponent(fn) + '&args=' + encodeURIComponent(JSON.stringify(args));
    req = fetch(url);
  }
  return req
    .then(r => r.json())
    .then(json => {
      if(!json.success) throw new Error(json.error || '오류가 발생했습니다.');
      return json.data;
    });
}

function fmt(n){ return Number(n).toLocaleString() + '원'; }

// ---------- 탭 전환 ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'admin') loadAdmin();
    if(btn.dataset.tab === 'menu') loadMenuAdmin();
    if(btn.dataset.tab === 'report') loadReport();
    if(btn.dataset.tab === 'teacher') refreshGlobalInfo();
  });
});

// 주문하기 탭을 계속 켜놓고 있어도, 사장님이 마감하면 화면을 새로고침하지 않아도
// 60초 안에 자동으로 마감 배너가 뜨도록 주기적으로 갱신한다.
setInterval(() => {
  const teacherPanel = document.getElementById('panel-teacher');
  if(teacherPanel && teacherPanel.classList.contains('active')){
    refreshGlobalInfo();
  }
}, 60000);

/* =========================================================
   선생님 주문 탭
   ========================================================= */
let selectedMenus = new Map(); // 선택된 메뉴의 idx(MENU_LIST 내 인덱스) → 수량
let DELIVERY_FEE = 4000;
let PER_PERSON_CAP = 9000;
let MENU_LIST = [];
let ORDERING_OPEN = true;

// 최초 로딩 시 getInitData(메뉴/교무실 등 고정정보) + getTeacherPageData(오늘 상태)를
// 서버 호출 1번으로 한꺼번에 받아온다 (예전엔 2번 따로 호출해서 첫 로딩이 느렸던 부분을 개선)
callApi('getInitPageData', []).then(data => {
  initTeacher(data.init);
  renderGlobalInfo(data.page);
}).catch(err => alert('초기 데이터를 불러오지 못했습니다: ' + err.message));

function initTeacher(data){
  DELIVERY_FEE = Number(data.deliveryFee);
  PER_PERSON_CAP = Number(data.perPersonCap);
  MENU_LIST = data.menu.map((m, i) => ({ idx: i, category: m.category, name: m.name, price: Number(m.price) }));

  const officeSel = document.getElementById('t-office');
  officeSel.innerHTML = '<option value="">-- 선택 --</option>' +
    data.offices.map(o => `<option value="${o.name}">${o.name} (${o.location})</option>`).join('');

  const categories = {};
  MENU_LIST.forEach(m => { (categories[m.category] = categories[m.category] || []).push(m); });

  const menuDiv = document.getElementById('t-menu');
  menuDiv.innerHTML = Object.keys(categories).map((cat, i) => `
    <details class="menu-cat" ${i === 0 ? 'open' : ''}>
      <summary>${cat}</summary>
      <div class="menu-grid">
        ${categories[cat].map(m =>
          `<div class="menu-item" data-idx="${m.idx}">
             <div class="name">${m.name}</div><div class="price">${fmt(m.price)}</div>
             <div class="qty-stepper">
               <button type="button" onclick="adjustQty(${m.idx}, -1)">－</button>
               <span id="qty-${m.idx}">1</span>
               <button type="button" onclick="adjustQty(${m.idx}, 1)">＋</button>
             </div>
           </div>`).join('')}
      </div>
    </details>
  `).join('');

  menuDiv.querySelectorAll('.menu-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('.qty-stepper')) return; // 수량 +/- 버튼 클릭은 별도 처리(adjustQty)
      if(el.classList.contains('soldout')) return;
      const idx = Number(el.dataset.idx);
      if(selectedMenus.has(idx)){
        selectedMenus.delete(idx);
        el.classList.remove('selected');
      } else {
        selectedMenus.set(idx, 1);
        el.classList.add('selected');
        const span = document.getElementById('qty-' + idx);
        if(span) span.textContent = '1';
      }
      renderSelectedSummary();
      updateTeacherButton();
    });
  });

  officeSel.addEventListener('change', checkPhoneNeeded);
}

// 교무실을 바꿀 때마다: 오늘 그 교무실에 이미 등록된 대표 연락처가 있는지 확인해서,
// 없으면(=오늘 첫 주문) 연락처 입력칸을 보여주고, 있으면 숨긴다.
function checkPhoneNeeded(){
  const office = document.getElementById('t-office').value;
  const field = document.getElementById('t-phone-field');
  const phoneInput = document.getElementById('t-phone');
  if(!office){
    field.style.display = 'none';
    phoneInput.value = '';
    updateTeacherButton();
    return;
  }
  callApi('getOfficeContact', [office]).then(existingPhone => {
    if(existingPhone){
      field.style.display = 'none';
      phoneInput.value = '';
    } else {
      field.style.display = 'block';
    }
    updateTeacherButton();
  }).catch(err => alert(err.message));
}

// 사장님이 "품절"로 메모 남긴 메뉴는 주문 화면에서 흐리게 표시하고 선택 불가 처리
// (soldOutNames는 getTeacherPageData()에서 함께 받아오므로 별도 서버 호출 없음)
function applySoldOutFromList(soldOutNames){
  const menuDiv = document.getElementById('t-menu');
  if(!menuDiv) return;
  const soldOutSet = new Set(soldOutNames);
  menuDiv.querySelectorAll('.menu-item').forEach(el => {
    const idx = Number(el.dataset.idx);
    const m = MENU_LIST[idx];
    const isSoldOut = m && soldOutSet.has(m.name);
    el.classList.toggle('soldout', !!isSoldOut);
    if(isSoldOut && !el.querySelector('.soldout-badge')){
      el.querySelector('.name').insertAdjacentHTML('beforeend', ' <span class="soldout-badge">품절</span>');
    }
    if(!isSoldOut){
      const badge = el.querySelector('.soldout-badge');
      if(badge) badge.remove();
    }
  });
}

// 메뉴 항목의 +/- 버튼으로 수량 조절. 1보다 작아지면 선택 자체를 해제한다.
function adjustQty(idx, delta){
  if(!selectedMenus.has(idx)) return;
  const next = selectedMenus.get(idx) + delta;
  const el = document.querySelector('.menu-item[data-idx="' + idx + '"]');
  if(next < 1){
    selectedMenus.delete(idx);
    if(el) el.classList.remove('selected');
    const span = document.getElementById('qty-' + idx);
    if(span) span.textContent = '1';
  } else {
    selectedMenus.set(idx, next);
    const span = document.getElementById('qty-' + idx);
    if(span) span.textContent = next;
  }
  renderSelectedSummary();
  updateTeacherButton();
}

function renderSelectedSummary(){
  const box = document.getElementById('t-selected');
  if(!selectedMenus.size){
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  const items = Array.from(selectedMenus.entries()).map(([idx, qty]) => ({ ...MENU_LIST[idx], qty }));
  const totalCount = items.reduce((s, m) => s + m.qty, 0);
  const total = items.reduce((s, m) => s + m.price * m.qty, 0);
  box.style.display = 'block';
  box.className = 'status open';
  box.innerHTML = `선택한 메뉴 (${totalCount}개): ` + items.map(m => `${m.name} ×${m.qty}`).join(', ') + `<br><b>합계: ${fmt(total)}</b>`;
}

// 교무실 선택 여부와 상관없이: 배달 장소, 오늘 전체 주문 현황, 전체 주문 내역, 품절 메뉴를
// 서버 호출 1번으로 한꺼번에 불러온다 (예전엔 3번 따로 호출해서 느렸던 부분을 개선)
function refreshGlobalInfo(){
  const statusDiv = document.getElementById('t-status');
  const isFirstLoad = !statusDiv.textContent.trim();
  if(isFirstLoad) statusDiv.textContent = '확인 중...';
  // 이미 보여주고 있는 내용이 있으면 지우지 않고 그대로 둔 채 조용히 새 데이터로만 교체한다

  callApi('getTeacherPageData', []).then(renderGlobalInfo).catch(err => {
    if(isFirstLoad){
      statusDiv.className = 'status closed';
      statusDiv.textContent = '정보를 불러오지 못했습니다: ' + err.message;
    }
    // 갱신 실패해도 이전 화면은 그대로 유지 (조용히 무시, 다음 자동 새로고침 때 다시 시도됨)
  });
}

// getTeacherPageData()가 반환한 데이터로 화면을 그린다.
// (최초 로딩 시에는 getInitPageData()로 한 번에 받아온 데이터를 바로 여기 넘겨서 왕복을 줄인다)
function renderGlobalInfo(data){
    const statusDiv = document.getElementById('t-status');
    const s = data.dayStatus;
    ORDERING_OPEN = !!s.open;

    const deliveryBox = document.getElementById('t-delivery-card');
    if(s.deliveryOffice){
      deliveryBox.innerHTML = `
        <div class="delivery-card">
          <div class="label">📍 오늘 배달 장소 (금액이 가장 큰 교무실로 자동 지정)</div>
          <div class="value">${s.deliveryLocation}</div>
          <div class="sub">${s.deliveryOffice}</div>
        </div>`;
    } else {
      deliveryBox.innerHTML = `
        <div class="delivery-card empty">
          <div class="label">📍 오늘 배달 장소</div>
          <div class="value">주문 없음</div>
        </div>`;
    }

    if(s.open){
      const remaining = Math.max(0, s.limit - s.withDelivery);
      statusDiv.className = 'status ' + (s.overLimit ? 'warn' : 'open');
      let html = `현재 주문 가능합니다 ✅ (오늘 전체 ${s.orderedCount}명 주문)` +
        `<br>현재 주문 금액: <b>${fmt(s.withDelivery)}</b> / 기준 금액: ${fmt(s.limit)} (${s.orderedCount}명 × ${fmt(PER_PERSON_CAP)})` +
        `<br>추가 주문 가능 금액: <b>${fmt(remaining)}</b>`;
      if(s.overLimit){
        html += `<br><b>⚠️ 전체 금액이 기준을 초과했습니다. 확인해 주세요.</b>`;
      }
      statusDiv.innerHTML = html;
      document.getElementById('t-closed-banner').innerHTML = '';

      if(s.overLimit){
        document.getElementById('t-overlimit-banner').innerHTML = `
          <div class="overlimit-banner">
            ⚠️ 주문 가능 금액을 초과했습니다
            <span class="sub">오늘 전체 ${s.orderedCount}명 × ${fmt(PER_PERSON_CAP)} = ${fmt(s.limit)} 기준 / 현재 주문 금액 ${fmt(s.withDelivery)}</span>
          </div>`;
      } else {
        document.getElementById('t-overlimit-banner').innerHTML = '';
      }
    } else {
      statusDiv.className = 'status closed';
      statusDiv.textContent = s.reason;
      document.getElementById('t-overlimit-banner').innerHTML = '';
      document.getElementById('t-closed-banner').innerHTML =
        `<div class="closed-banner">🔒 ${s.reason}</div>`;
    }

    renderAllOrdersForTeacher(data.adminData);
    applySoldOutFromList(data.soldOutMenus);
    updateTeacherButton();
}

// 오늘 전체 주문 내역을 교무실별로 일괄 표시 (선생님 화면에서는 읽기 전용, 체크/메모 수정 불가)
function renderAllOrdersForTeacher(data){
  const box = document.getElementById('t-all-orders');
  const rows = data.rows;
  if(!rows.length){
    box.innerHTML = '';
    return;
  }
  // 교무실 → 이름 순으로 정렬 (새로고침될 때마다 항상 이 순서로 다시 정렬됨)
  const sortedRows = rows.slice().sort((a, b) => {
    const officeCmp = String(a.office).localeCompare(String(b.office), 'ko');
    if(officeCmp !== 0) return officeCmp;
    return String(a.name).localeCompare(String(b.name), 'ko');
  });
  const byOffice = {};
  sortedRows.forEach(r => { (byOffice[r.office] = byOffice[r.office] || []).push(r); });

  const menuSummary = (data.summary && data.summary.menuSummary) || [];
  const menuSummaryHtml = menuSummary.length ? `
    <div style="margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);">
      <div style="font-size:15px;font-weight:700;margin-bottom:6px;">🍽️ 메뉴별 합계</div>
      <div style="font-size:14px;color:var(--muted);line-height:1.9;">
        ${menuSummary.map(m => `${m.name} × ${m.count} <span style="color:#b3b3b3;">(${fmt(m.totalPrice)})</span>`).join(' &nbsp;·&nbsp; ')}
      </div>
    </div>` : '';

  box.innerHTML = '<div style="margin-top:6px;">' + menuSummaryHtml + Object.keys(byOffice).map(office => {
    const items = byOffice[office];
    const total = items.reduce((s, i) => s + Number(i.price), 0);
    const peopleCount = new Set(items.map(i => i.session)).size;
    return `
      <div style="margin-bottom:14px;">
        <div style="font-size:15px;font-weight:700;margin-bottom:6px;">${office} <span style="font-weight:400;font-size:13px;color:var(--muted)">· ${peopleCount}명 · ${fmt(total)}</span></div>
        <div style="font-size:14px;color:var(--muted);line-height:2.1;">
          ${groupOrderItems(items).map(i => {
            const mark = i.confirmed ? '✅' : '⏳';
            const memoHtml = i.memo ? ` <span style="color:#b06000;">📝 ${i.memo}</span>` : '';
            const nameEsc = (i.name || '').replace(/'/g, "\\'");
            const firstRow = i.rows[0]; // 메뉴변경/취소는 묶음 중 1건만 대상으로 함 (나머지는 그대로 남음)
            const qtyLabel = i.qty > 1 ? ` <b>×${i.qty}</b>` : '';
            const cancelLabel = i.qty > 1 ? '1개 취소' : '취소';
            const controls = i.confirmed ? '' : `
              <span class="no-print">
                <button onclick="startChangeOrder(${firstRow}, '${nameEsc}')" style="border:none;background:none;color:#4285F4;cursor:pointer;font-size:12px;text-decoration:underline;padding:0 2px;">메뉴변경</button>
                <button onclick="cancelMyOrder(${firstRow}, '${nameEsc}')" style="border:none;background:none;color:#a50e0e;cursor:pointer;font-size:12px;text-decoration:underline;padding:0 2px;">${cancelLabel}</button>
              </span>`;
            return `<div id="order-line-${firstRow}">${mark} ${i.name}${qtyLabel} - <span id="order-menu-${firstRow}">${fmt(i.price * i.qty)}${i.qty > 1 ? ` (개당 ${fmt(i.price)})` : ''}</span>${memoHtml}${controls}</div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('') + '</div>';
}

// 본인 주문 메뉴 변경 시작: 이름 확인 후 그 줄을 드롭다운으로 바꿔서 새 메뉴를 고르게 한다
function startChangeOrder(row, orderName){
  const name = prompt(`본인 확인을 위해 주문하신 성함을 입력해 주세요 (예: ${orderName})`);
  if(name === null || !name.trim()) return;
  const span = document.getElementById('order-menu-' + row);
  if(!span) return;
  const options = MENU_LIST.map(m => `<option value="${m.name}">[${m.category}] ${m.name} (${fmt(m.price)})</option>`).join('');
  span.innerHTML = `
    <select id="change-select-${row}" style="margin:0;padding:5px 6px;font-size:12px;width:auto;display:inline-block;">${options}</select>
    <button onclick="applyChangeOrder(${row}, '${name.trim().replace(/'/g, "\\'")}')" style="border:none;background:#4285F4;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;margin-left:4px;">변경 확인</button>`;
}

function applyChangeOrder(row, name){
  const select = document.getElementById('change-select-' + row);
  if(!select) return;
  callApi('changeOrderItem', [row, name, select.value], 'POST').then(res => {
    if(!res.ok) alert(res.message);
    refreshGlobalInfo();
  }).catch(err => alert(err.message));
}

// 본인 주문(메뉴 한 개) 취소
function cancelMyOrder(row, orderName){
  const name = prompt(`본인 확인을 위해 주문하신 성함을 입력해 주세요 (예: ${orderName})`);
  if(name === null || !name.trim()) return;
  if(!confirm(`"${orderName}"님의 주문을 취소할까요?`)) return;
  callApi('cancelOrderItem', [row, name.trim()], 'POST').then(res => {
    if(!res.ok) alert(res.message);
    refreshGlobalInfo();
  }).catch(err => alert(err.message));
}

function updateTeacherButton(){
  const office = document.getElementById('t-office').value;
  const name = document.getElementById('t-name').value.trim();
  const phoneNeeded = document.getElementById('t-phone-field').style.display !== 'none';
  const phone = document.getElementById('t-phone').value.trim();
  document.getElementById('t-submit').disabled = !(ORDERING_OPEN && office && name && selectedMenus.size > 0 && (!phoneNeeded || phone));
}
document.getElementById('t-name').addEventListener('input', updateTeacherButton);
// 숫자만 입력해도 자동으로 010-0000-0000 형태로 하이픈을 넣어준다
document.getElementById('t-phone').addEventListener('input', e => {
  const digits = e.target.value.replace(/[^0-9]/g, '').slice(0, 11);
  let formatted = digits;
  if(digits.length > 3 && digits.length <= 7){
    formatted = digits.slice(0,3) + '-' + digits.slice(3);
  } else if(digits.length > 7){
    formatted = digits.slice(0,3) + '-' + digits.slice(3,7) + '-' + digits.slice(7);
  }
  e.target.value = formatted;
  updateTeacherButton();
});

document.getElementById('t-submit').addEventListener('click', () => {
  const office = document.getElementById('t-office').value;
  const name = document.getElementById('t-name').value.trim();
  const phone = document.getElementById('t-phone').value.trim();
  const btn = document.getElementById('t-submit');
  const msg = document.getElementById('t-msg');
  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = '주문 처리 중...';

  // 선택한 수량만큼 메뉴명을 반복해서 보낸다 (예: 김밥 2개 → ['소담김밥','소담김밥'])
  const menuNames = [];
  selectedMenus.forEach((qty, idx) => {
    for(let i = 0; i < qty; i++) menuNames.push(MENU_LIST[idx].name);
  });

  callApi('submitOrder', [office, name, menuNames, phone], 'POST').then(res => {
    msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
    msg.textContent = res.message;
    if(res.ok){
      document.getElementById('t-name').value = '';
      document.getElementById('t-phone').value = '';
      document.getElementById('t-phone-field').style.display = 'none';
      selectedMenus.clear();
      document.querySelectorAll('#t-menu .menu-item').forEach(x => x.classList.remove('selected'));
      document.querySelectorAll('#t-menu .qty-stepper span').forEach(x => x.textContent = '1');
      renderSelectedSummary();
    }
    refreshGlobalInfo();
  }).catch(err => {
    msg.className = 'msg err';
    msg.textContent = '주문 처리 중 오류가 발생했습니다: ' + err.message;
  }).finally(() => { btn.disabled = false; });
});

// 탭 제목 옆에 "새로고침 중..." 같은 작은 표시를 붙였다 뗐다 하는 헬퍼
function setRefreshingBadge(id, on){
  let el = document.getElementById(id);
  if(!el) return;
  el.style.display = on ? 'inline' : 'none';
}

let AUDIO_CTX = null;

// 브라우저는 "사용자가 방금 누른 동작"과 상관없어 보이는 소리(서버 응답 이후 재생 등)는
// 자동재생으로 간주해 막는 경우가 많다. 클릭한 그 순간(동기) 안에 미리 소리 재생 장치를
// 한 번 깨워두면("잠금 해제"), 이후 비동기로 재생해도 막히지 않는다.
function unlockSpeech(){
  if('speechSynthesis' in window){
    try{
      const unlock = new SpeechSynthesisUtterance(' ');
      unlock.volume = 0;
      window.speechSynthesis.speak(unlock);
    } catch(e){ /* 무시 */ }
  }
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx){
      if(!AUDIO_CTX) AUDIO_CTX = new Ctx();
      if(AUDIO_CTX.state === 'suspended') AUDIO_CTX.resume();
    }
  } catch(e){ /* 무시 */ }
}

// 짧은 "삐" 알림음 (Web Audio API로 직접 생성 - 음성 합성이 막힌 환경에서도 최대한 소리가 나도록 하는 보조 수단)
function playBeep(){
  try{
    if(!AUDIO_CTX) return; // unlockSpeech()에서 미리 만들어둔 컨텍스트가 없으면 재생 포기
    const osc = AUDIO_CTX.createOscillator();
    const gain = AUDIO_CTX.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, AUDIO_CTX.currentTime);
    osc.connect(gain);
    gain.connect(AUDIO_CTX.destination);
    osc.start();
    osc.stop(AUDIO_CTX.currentTime + 0.35);
  } catch(e){ /* 무시 */ }
}

// 사장님 확인 탭을 열거나 새로고침했을 때, 오늘 주문이 있으면 음성으로 알려준다
// (평소 다른 탭 접속 시엔 아무 소리도 나지 않고, 이 탭에서 실제로 주문이 있을 때만 말합니다)
function speakOrderAlert(){
  playBeep();
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel(); // 혹시 이전 음성이 겹치지 않도록
    const utter = new SpeechSynthesisUtterance('사장님, 청북고 주문이 있습니다.');
    utter.lang = 'ko-KR';
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
  } catch(e){ /* 음성 지원 안 되는 환경이면 조용히 무시 */ }
}

// 같은 사람이 같은 메뉴를 여러 개 시켰을 때(이름·메뉴·가격·확인상태·메모가 모두 같은 건),
// 화면에서 중복으로 보이지 않도록 하나로 묶어서 수량(qty)과 해당 건들의 row 번호 목록(rows)을 붙여준다.
// 확인상태나 메모가 서로 다르면(예: 하나만 확인 체크됨) 다른 건으로 취급해 묶지 않는다.
function groupOrderItems(items){
  const order = [];
  const map = new Map();
  items.forEach(i => {
    const key = [i.name, i.price, i.confirmed ? 1 : 0, i.memo || '', i.session || (i.name + i.time)].join('|');
    if(map.has(key)){
      const g = map.get(key);
      g.qty += 1;
      g.rows.push(i.row);
    } else {
      const g = { ...i, qty: 1, rows: [i.row] };
      map.set(key, g);
      order.push(g);
    }
  });
  return order;
}

function renderAdmin(data){
  const container = document.getElementById('a-content');

  speakOrderAlert();

  deliveryBox.innerHTML = `
    <div class="delivery-card">

      <div class="value">${s.deliveryLocation}</div>
      <div class="sub">${s.deliveryOffice}</div>
    </div>`;

  const summaryHtml = `
    <div class="group">
      <div class="group-head">
        <div class="title">📦 오늘 배달 요약
          ${s.overLimit ? `<span class="warn-badge">⚠️ 기준 초과 (${fmt(s.withDelivery)} / ${fmt(s.limit)})</span>` : ''}
        </div>
      </div>
      <div style="font-size:14px;line-height:1.8;">
        전체 인원: <b>${s.count}명</b> · 현재 주문 금액: <b>${fmt(s.withDelivery)}</b> · 기준 금액: ${fmt(s.limit)}<br>
        추가 주문 가능 금액: <b>${fmt(Math.max(0, s.limit - s.withDelivery))}</b>
      </div>
    </div>`;

  const menuSummaryHtml = (s.menuSummary && s.menuSummary.length) ? `
    <div class="group">
      <div class="group-head"><div class="title">🍽️ 메뉴별 집계</div></div>
      <table>
        <tr><th>메뉴</th><th>수량</th><th>금액</th></tr>
        ${s.menuSummary.map(m => `<tr><td>${m.name}</td><td>${m.count}개</td><td>${fmt(m.totalPrice)}</td></tr>`).join('')}
      </table>
    </div>` : '';

  const byOffice = {};
  rows.forEach(r => { (byOffice[r.office] = byOffice[r.office] || []).push(r); });

  const groupsHtml = Object.keys(byOffice).map(office => {
    const items = byOffice[office];
    const total = items.reduce((acc, i) => acc + Number(i.price), 0);
    const peopleCount = new Set(items.map(i => i.session)).size;
    const isDeliveryOffice = office === s.deliveryOffice;
    const contact = (items.find(i => i.phone) || {}).phone || '';
    return `
    <div class="group">
      <div class="group-head">
        <div class="title">${office} <span style="font-weight:400;font-size:13px;color:var(--muted)">(${items[0].location || ''})</span>
          ${isDeliveryOffice ? '<span class="warn-badge" style="background:#e6f4ea;color:#137333;border-color:#c6e6cf;">📍 배달 장소</span>' : ''}
        </div>
        <div class="sum">${peopleCount}명 · 메뉴합계 ${fmt(total)}${contact ? ` · 📞 ${contact}` : ''}</div>
      </div>
      <table>
        <tr><th>확인</th><th>시간</th><th>이름</th><th>메뉴</th><th>가격</th><th>메모</th></tr>
        ${groupOrderItems(items).map(i => {
          const rowsAttr = i.rows.join(',');
          const groupId = i.rows[0]; // 그룹을 식별할 대표 row (메모 입력칸 id 등에 사용)
          return `<tr>
          <td class="no-print"><input type="checkbox" ${i.confirmed ? 'checked' : ''} onchange="toggleOrderGroup([${rowsAttr}], this.checked, ${groupId})"></td>
          <td class="print-only" style="display:none">${i.confirmed ? '✅' : ''}</td>
          <td>${i.time}</td><td>${i.name}</td>
          <td>${i.menu}${i.qty > 1 ? ` <b>×${i.qty}</b>` : ''}</td>
          <td>${fmt(i.price * i.qty)}${i.qty > 1 ? `<br><span style="font-size:11px;color:var(--muted);">(개당 ${fmt(i.price)})</span>` : ''}</td>
          <td>
            <select class="no-print" style="margin:0 0 4px 0;padding:7px 9px;font-size:12px;width:100%;"
              onchange="if(this.value){ document.getElementById('memo-${groupId}').value = this.value; setMemoGroup([${rowsAttr}], this.value); } this.selectedIndex=0;">
              <option value="">⚡ 빠른 선택</option>
              <option value="품절, 다른 메뉴 변경 요청">품절, 다른 메뉴 변경 요청</option>
              <option value="확인 완료, 정상 준비 중">확인 완료, 정상 준비 중</option>
            </select>
            <input type="text" id="memo-${groupId}" class="no-print" style="margin:0;padding:7px 9px;font-size:13px;"
              placeholder="예: 재고없음"
              value="${(i.memo || '').replace(/"/g, '&quot;')}"
              onchange="setMemoGroup([${rowsAttr}], this.value)">
            <span class="print-only" style="display:none">${i.memo || ''}</span>
          </td>
        </tr>`;
        }).join('')}
      </table>
    </div>`;
  }).join('');

  container.innerHTML = summaryHtml + menuSummaryHtml + groupsHtml;
}

// 체크박스를 켜면 자동으로 "확인 완료, 정상 준비 중" 메모를 채워준다.
// 체크를 끄는 경우에는 메모를 자동으로 바꾸지 않고, 사장님이 빠른 선택에서 "품절..." 등을 직접 고르도록 둔다.
// rows: 화면에 하나로 묶여 보이는 동일 메뉴 여러 건의 row 번호 배열 (수량이 1개면 원소 1개짜리 배열)
function toggleOrderGroup(rows, checked, groupId){
  callApi('setOrderConfirmedBulk', [rows, checked], 'POST').catch(err => alert(err.message));
  if(checked){
    const text = '확인 완료, 정상 준비 중';
    const input = document.getElementById('memo-' + groupId);
    if(input) input.value = text;
    callApi('setOrderMemoBulk', [rows, text], 'POST').catch(err => alert(err.message));
  }
}

function setMemoGroup(rows, memo){
  callApi('setOrderMemoBulk', [rows, memo], 'POST').catch(err => alert(err.message));
}

// 오늘 전체 주문을 한 번에 마감 처리 (모든 주문 확인 체크 + 이후 주문 차단)
function closeAllOrders(){
  if(!confirm('오늘 접수된 모든 주문을 확인 완료 처리하고, 이후 주문을 마감할까요?\n(마감 후에는 선생님들이 주문을 추가할 수 없습니다)')) return;
  callApi('closeAllOrdersToday', [], 'POST').then(() => {
    loadAdmin();
  }).catch(err => alert(err.message));
}

// 마감을 해제해서 다시 주문받을 수 있게 되돌리기 (모든 확인 체크를 해제)
function reopenAllOrders(){
  if(!confirm('오늘 주문 마감을 해제하고 다시 주문을 받을까요?\n(모든 확인 체크가 해제됩니다)')) return;
  callApi('reopenAllOrdersToday', [], 'POST').then(() => {
    loadAdmin();
  }).catch(err => alert(err.message));
}

/* =========================================================
   메뉴 관리 탭
   ========================================================= */
function loadMenuAdmin(){
  const container = document.getElementById('m-content');
  const isFirstLoad = !container.innerHTML.trim();
  if(isFirstLoad){
    container.innerHTML = '<div class="empty">불러오는 중...</div>';
  } else {
    setRefreshingBadge('m-refreshing', true);
  }
  callApi('getMenuList', []).then(list => {
    setRefreshingBadge('m-refreshing', false);
    renderMenuAdmin(list);
  }).catch(err => {
    setRefreshingBadge('m-refreshing', false);
    if(isFirstLoad){
      container.innerHTML = '<div class="group"><div class="empty">불러오지 못했습니다: ' + err.message + '</div></div>';
    } else {
      alert('새로고침 중 오류: ' + err.message + ' (화면은 이전 내용이 유지됩니다)');
    }
  });
}

function renderMenuAdmin(list){
  const box = document.getElementById('m-content');
  if(!list.length){
    box.innerHTML = '<div class="group"><div class="empty">등록된 메뉴가 없습니다.</div></div>';
    return;
  }
  const byCat = {};
  list.forEach(m => { (byCat[m.category] = byCat[m.category] || []).push(m); });

  box.innerHTML = Object.keys(byCat).map(cat => `
    <div class="group">
      <div class="group-head"><div class="title">${cat}</div><div class="sum">${byCat[cat].length}개</div></div>
      <table>
        <tr><th>메뉴명</th><th>가격</th><th></th></tr>
        ${byCat[cat].map(m => `<tr>
          <td><input type="text" id="m-name-${m.row}" value="${(m.name || '').replace(/"/g, '&quot;')}" style="margin:0;padding:8px 10px;font-size:14px;"></td>
          <td style="width:120px;"><input type="number" id="m-price-${m.row}" value="${m.price}" style="margin:0;padding:8px 10px;font-size:14px;"></td>
          <td style="white-space:nowrap;">
            <button class="btn ghost" style="width:auto;margin:0;padding:8px 12px;font-size:13px;" onclick="saveMenuItem(${m.row}, '${cat.replace(/'/g, "\\'")}')">저장</button>
            <button class="btn" style="width:auto;margin:0;padding:8px 12px;font-size:13px;background:linear-gradient(120deg,#D96570,#b03a3a);" onclick="removeMenuItem(${m.row}, '${(m.name || '').replace(/'/g, "\\'")}')">삭제</button>
          </td>
        </tr>`).join('')}
      </table>
    </div>
  `).join('');
}

function saveMenuItem(row, category){
  const name = document.getElementById('m-name-' + row).value.trim();
  const price = document.getElementById('m-price-' + row).value;
  callApi('updateMenuItem', [row, category, name, price], 'POST').then(res => {
    if(!res.ok){ alert(res.message); return; }
    loadMenuAdmin();
  }).catch(err => alert(err.message));
}

function removeMenuItem(row, name){
  if(!confirm(`"${name}" 메뉴를 삭제할까요?`)) return;
  callApi('deleteMenuItem', [row], 'POST').then(() => {
    loadMenuAdmin();
  }).catch(err => alert(err.message));
}

function addMenu(){
  const category = document.getElementById('m-new-category').value.trim();
  const name = document.getElementById('m-new-name').value.trim();
  const price = document.getElementById('m-new-price').value;
  const msg = document.getElementById('m-add-msg');
  msg.className = 'msg';
  msg.textContent = '추가 중...';

  callApi('addMenuItem', [category, name, price], 'POST').then(res => {
    msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
    msg.textContent = res.ok ? '메뉴가 추가되었습니다!' : res.message;
    if(res.ok){
      document.getElementById('m-new-category').value = '';
      document.getElementById('m-new-name').value = '';
      document.getElementById('m-new-price').value = '';
      loadMenuAdmin();
    }
  }).catch(err => {
    msg.className = 'msg err';
    msg.textContent = err.message;
  });
}

/* =========================================================
   주문 내역(리포트) 탭
   ========================================================= */
document.getElementById('r-range').addEventListener('change', e => {
  const isCustom = e.target.value === 'custom';
  document.getElementById('r-customStart').style.display = isCustom ? 'block' : 'none';
  document.getElementById('r-customEnd').style.display = isCustom ? 'block' : 'none';
});

function loadReport(){
  const range = document.getElementById('r-range').value;
  const start = document.getElementById('r-start').value;
  const end = document.getElementById('r-end').value;
  document.getElementById('r-result').innerHTML = '조회 중...';
  callApi('getOrderReport', [range, start, end]).then(renderReport)
    .catch(err => { document.getElementById('r-result').innerHTML = '조회 중 오류: ' + err.message; });
}

function renderReport(data){
  const rows = data.rows;
  const box = document.getElementById('r-result');
  if(!rows.length){
    box.innerHTML = `<div>${data.startDate} ~ ${data.endDate} 기간에 주문 내역이 없습니다.</div>`;
    return;
  }

  // 날짜별로 묶어서, 각 날짜의 마지막 줄 다음에 그날의 배달비 한 줄을 끼워 넣는다
  const byDate = {};
  rows.forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
  const dates = Object.keys(byDate).sort();

  const bodyHtml = dates.map(date => {
    const items = byDate[date];
    const itemRows = items.map(r => `<tr>
      <td>${r.date}</td><td>${r.office}</td><td>${r.name}</td><td>${r.menu}</td>
      <td>${fmt(r.price)}</td><td>${r.confirmed ? '✅' : ''}</td><td>${r.memo || ''}</td>
    </tr>`).join('');
    const deliveryRow = `<tr style="background:#f8f9fa;font-weight:600;">
      <td>${date}</td><td colspan="3">🚚 배달비 (해당 날짜 1건)</td>
      <td>${fmt(data.deliveryFee)}</td><td></td><td></td>
    </tr>`;
    return itemRows + deliveryRow;
  }).join('');

  box.innerHTML = `
    <table>
      <tr><th>날짜</th><th>교무실</th><th>이름</th><th>메뉴</th><th>가격</th><th>확인</th><th>메모</th></tr>
      ${bodyHtml}
    </table>
    <div class="summary">
      ${data.startDate} ~ ${data.endDate} · 총 ${rows.length}건 (+배달비 ${data.dayCount}건)<br>
      메뉴 합계 ${fmt(data.menuTotal)} + 배달비 합계 ${fmt(data.deliveryTotal)} (${data.dayCount}일 × ${fmt(data.deliveryFee)})
      = <b>총 ${fmt(data.totalWithDelivery)}</b>
    </div>
  `;
}
</script>
</body>
</html>
